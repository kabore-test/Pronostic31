<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Pro | IA Football Analysis</title>
    <link rel="stylesheet" href="data.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <h1>PREDICTOR <span style="color:var(--accent)">PRO</span></h1>
                <div class="subhead">
                    <span id="dataModeBadge" class="badge">INITIALISATION...</span>
                    <span class="muted tiny">Neural Engine v5.0</span>
                </div>
            </div>
            <div class="bankroll-display">
                <label class="tiny muted uppercase">Capital (CFA)</label><br>
                <input type="number" id="inputBankroll" value="10000">
            </div>
        </header>

        <section class="panel ai-oracle">
            <div class="dual-select-grid">
                <div class="select-side">
                    <label class="tiny muted uppercase">🏠 Domicile</label>
                    <input type="text" id="homeSearch" placeholder="Ex: Real Madrid" autocomplete="off">
                </div>
                <div class="vs-divider">VS</div>
                <div class="select-side">
                    <label class="tiny muted uppercase">✈️ Extérieur</label>
                    <input type="text" id="awaySearch" placeholder="Ex: Man City" autocomplete="off">
                </div>
            </div>

            <button id="btnAiSearch" class="btn-main-action">LANCER L'ANALYSE IA</button>

            <div class="quick-matches">
                <p class="tiny muted uppercase" style="margin: 15px 0 10px 0;">⚡ Matchs en direct / à venir</p>
                <div id="quickMatchList" class="quick-match-grid"></div>
            </div>
        </section>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p class="muted uppercase tiny">Analyse des algorithmes en cours...</p>
        </div>

        <div id="affichage"></div>

        <div id="statsDetails" class="panel hidden"></div>

        <section id="pronostics" class="panel hidden">
            <h2 class="uppercase tiny muted">Probabilités de victoire</h2>
            <div id="probContainer"></div>
        </section>

        <div id="iaPredictionContainer" class="hidden">
            <div id="iaPrediction" class="ia-prediction-card"></div>
        </div>

        <section class="panel history-section">
            <h3 class="tiny muted uppercase">Analyses Récentes</h3>
            <div id="betHistory" class="history-list"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
